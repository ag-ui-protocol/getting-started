[project]
name = "ag-ui-crewai"
version = "0.2.0"
description = "Implementation of the AG-UI protocol for CrewAI"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Markus Ecker", email = "markus.ecker@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10,<3.14"
# Poetry caret ranges translated to explicit bounds; crewai pin preserved for CPK-7718.
dependencies = [
    "ag-ui-protocol>=0.1.10",
    "fastapi>=0.115.12,<0.116.0",
    "uvicorn>=0.34.3,<0.35.0",
    "crewai>=0.130.0,<0.131.0",
]

[project.scripts]
dev = "ag_ui_crewai.dojo:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<0.25",
    # Dev-only; <0.29 guards against a breaking httpx 0.x minor.
    "httpx>=0.27,<0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Shared across wheel and sdist so the exclude list is not repeated per target.
[tool.hatch.build]
exclude = [
    "ag_ui_crewai/dojo.py",
    "ag_ui_crewai/examples/**",
]

[tool.hatch.build.targets.wheel]
packages = ["ag_ui_crewai"]

# Lean sdist: package + metadata only (~31 KB), matching the pre-migration Poetry sdist.
[tool.hatch.build.targets.sdist]
include = [
    "ag_ui_crewai",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
