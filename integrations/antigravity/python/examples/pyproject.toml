tool.uv.package = true

[project]
name = "antigravity-examples"
version = "0.1.0"
description = "Example usage of the Antigravity integration with FastAPI"
license = "MIT"

readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "fastapi>=0.115.2",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.35.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.11.7",
    "ag_ui_antigravity",
]

[project.scripts]
dev = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.uv.sources]
ag_ui_antigravity = { path = "../", editable = true }
