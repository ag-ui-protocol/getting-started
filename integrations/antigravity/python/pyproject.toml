[project]
name = "ag_ui_antigravity"
description = "Google Antigravity integration for the AG-UI Protocol"
version = "0.1.0"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10, <3.15"
dependencies = [
    "ag-ui-protocol>=0.1.19",
    # The Antigravity SDK ships a platform-specific wheel that bundles the Go
    # "localharness" binary the Python API drives over a WebSocket. Pinned to a
    # minor range: the SDK is young and its surface is still moving.
    "google-antigravity>=0.1.8,<0.2.0",
    "fastapi>=0.115.2",
    "pydantic>=2.11.7",
    "sse-starlette>=2.1.0",
    "uvicorn>=0.35.0",
]
license = "MIT"

[tool.ag-ui.scripts]
test = "python -m pytest"

[build-system]
requires = ["uv_build>=0.8.0,<0.11"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://github.com/ag-ui-protocol/ag-ui/tree/main/integrations/antigravity/python"
Issues = "https://github.com/ag-ui-protocol/ag-ui/issues"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: end-to-end tests that start a real harness and call a real model",
]
addopts = "-m 'not live'"
